[user]
name = "Connor McCarthy"
email = "connor15mcc@gmail.com"

[ui]
default-command = ["log", "--limit=5", "--template=builtin_log_compact"]
pager = "delta"
diff-formatter = ":git"

[templates]
git_push_bookmark = '"connor15mcc/" ++ change_id.shortest(3)'
draft_commit_description = '''
concat(
  coalesce(description, default_commit_description, "\n"),
  surround(
    "\nJJ: This commit contains the following changes:\n", "",
    indent("JJ:     ", diff.stat(72)),
  ),
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''
log_node = '''
  label("node",
    coalesce(
      if(!self, label("elided", "~")),
      if(current_working_copy, label("working_copy", "@")),
      if(conflict, label("conflict", "×")),
      if(immutable, label("immutable", "*")),
      label("normal", "·")
    )
  )
'''
file_annotate = '''
separate(" ",
  commit.change_id().shortest(8),
  pad_end(8, truncate_end(8, commit.author().name())),
  pad_end(11, format_timestamp(commit_timestamp(commit))),
  pad_start(4, line_number),
) ++ ": " ++ content
'''

[aliases]
tug = ["bookmark", "advance"]
drag = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """
set -euo pipefail
if [ -z "${1:-}" ]; then
    bookmark=`jj log -r 'trunk()' --no-graph -T 'bookmarks.map(|b| b.name()).join("\n")' | head -1`
    if [ -z "$bookmark" ]; then
        echo "Error: Could not resolve trunk bookmark"
        exit 1
    fi
else
    bookmark="$1"
fi
jj git fetch -b "$bookmark"
jj rebase -s "at_operation(@-, ${bookmark}+) & mutable()" -d "$bookmark"
""",
  "",
]

mine = ["bookmark", "list", "-r", "mine()"]
rebase-all = ["rebase", "-s", "(::trunk())+ & mutable()", "-d", "trunk()"]
accuse = ["file", "annotate"]
iso = ["util", "exec", "--", "jj-iso"]

[revsets]
bookmark-advance-to = 'closest_pushable(@)'

[revset-aliases]
# To prevent rewriting commits authored by other users:
"immutable_heads()" = "builtin_immutable_heads() | (trunk().. & ~mine())"

'closest_bookmark(to)' = 'heads(::to & bookmarks())'
'closest_pushable(to)' = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'


[template-aliases]
# Show unique prefix and the rest surrounded by brackets
'format_short_id(id)' = 'id.shortest(12).prefix() ++ "[" ++ id.shortest(12).rest() ++ "]"'
# Show username (rather than email)
'format_short_signature(signature)' = 'signature.email().local()'
default_commit_description = '''
"

"
'''
"format_timestamp(timestamp)" = "timestamp.ago()"

[git]
private-commits = "description(glob:'private:*')"

[fix.tools.rustfmt]
command = ["rustfmt", "+nightly"]
patterns = ["glob:**/*.rs"]

[fix.tools.1-ruff-lint]
command = [
  "uv",
  "run",
  "ruff",
  "check",
  "--fix",
  "--preview",
  "--quiet",
  "--stdin-filename=$path",
  "-",
]
patterns = ["glob:'**/*.py'"]

[fix.tools.2-ruff-format]
command = ["uv", "run", "ruff", "format", "--stdin-filename=$path", "-"]
patterns = ["glob:'**/*.py'"]

[fix.tools.gofmt]
command = ["goimports"]
patterns = ["glob:'**/*.go'"]

[merge-tools.":both"]
program = "jj-merge-both"
merge-args = ["$base", "$left", "$right", "$output"]

